name: NavigationXDemo
options:
  bundleIdPrefix: com.navigationx
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true

packages:
  NavigationX:
    path: ../..

targets:
  NavigationXDemo:
    type: application
    platform: iOS
    sources:
      - NavigationXDemo
    dependencies:
      - package: NavigationX
        product: NavigationX
      - package: NavigationX
        product: NavigationXLite
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.navigationx.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  NavigationXDemo:
    build:
      targets:
        NavigationXDemo: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
